[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aytube"
version = "2.1.2"
description = "Ultra-fast YouTube Video & Audio Downloader / Stream Extractor in Python (pytube & yt-dlp alternative without 403 Forbidden, 4K/1080p, Cookie support & CLI)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ABHISHEK THAKUR", email = "abhiyanshicreation@gmail.com"},
]
keywords = [
    "youtube", "youtube-downloader", "youtube video downloader",
    "youtube audio downloader", "pytube", "pytube alternative",
    "pytube 403 forbidden fix", "yt-dlp", "yt-dlp alternative",
    "youtube stream extractor", "stream extractor", "youtube download",
    "download youtube video", "youtube 4k download", "youtube 1080p",
    "youtube audio", "youtube mp3", "youtube mp4", "youtube cookies",
    "youtube innertube", "innertube api", "youtube bot bypass",
    "youtube playlist downloader", "youtube shorts downloader",
    "video downloader", "audio downloader", "direct stream url",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/Sinchu-xD/AyTube"
"Bug Reports" = "https://github.com/Sinchu-xD/AyTube/issues"
Source = "https://github.com/Sinchu-xD/AyTube"

[project.scripts]
aytube = "aytube.__main__:main"

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "examples", "aytube._debug*"]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
