[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aytube"
version = "1.0.0"
description = "Extract direct YouTube stream URLs from any YouTube URL format"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ABHISHEK THAKUR", email = "abhiyanshicreation@gmail.com"},
]
keywords = [
    "youtube", "downloader", "youtube downloader", "youtube video downloader",
    "youtube extractor", "youtube stream", "youtube-dl", "yt-dlp",
    "yt-dlp alternative", "pytube alternative", "youtube audio",
    "video downloader", "audio extractor", "stream extractor",
    "youtube download", "youtube video", "youtube audio downloader",
    "youtube playlist", "youtube shorts", "youtube embed",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/Sinchu-xD/AyTube"
"Bug Reports" = "https://github.com/Sinchu-xD/AyTube/issues"
Source = "https://github.com/Sinchu-xD/AyTube"

[project.scripts]
aytube = "aytube.__main__:main"

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "examples", "aytube._debug*"]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
